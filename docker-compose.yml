version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: security_force_postgres
    environment:
      POSTGRES_USER: security_admin
      POSTGRES_PASSWORD: SecurityPassword2026!
      POSTGRES_DB: security_force_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security_admin -d security_force_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
